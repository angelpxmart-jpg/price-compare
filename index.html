<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競品比價工具</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  background: #f4f6fb;
  color: #222;
  font-size: 14px;
  min-height: 100vh;
}

.screen { display: none; }
.screen.active { display: block; }

/* ---- Input Screen ---- */
.container {
  max-width: 660px;
  margin: 64px auto;
  padding: 0 24px 80px;
}
.container.wide {
  max-width: 1160px;
  margin: 36px auto;
  padding: 0 24px 80px;
}

.brand-dots {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-bottom: 12px;
}
.dot { width: 10px; height: 10px; border-radius: 50%; }

h1 { font-size: 26px; font-weight: 700; color: #13227f; }
.subtitle { color: #888; font-size: 14px; margin: 6px 0 32px; }

.format-card {
  background: #eef1ff;
  border: 1.5px solid #c8d0f5;
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 20px;
}
.format-title {
  font-size: 11px;
  font-weight: 700;
  color: #13227f;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 10px;
}
.format-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 7px;
}
.format-row:last-child { margin-bottom: 0; }
code {
  background: white;
  border: 1px solid #dde3f5;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12.5px;
  font-family: "SF Mono", Monaco, "Courier New", monospace;
  color: #333;
  white-space: nowrap;
}
.format-note { color: #666; font-size: 12px; }
.format-tip { margin-top: 10px; font-size: 12px; color: #888; line-height: 1.5; }

textarea {
  width: 100%;
  padding: 16px;
  border: 1.5px solid #dde3f5;
  border-radius: 12px;
  font-size: 13.5px;
  font-family: "SF Mono", Monaco, "Courier New", monospace;
  resize: vertical;
  line-height: 1.7;
  background: white;
  transition: border-color 0.15s;
}
textarea:focus { outline: none; border-color: #13227f; }

.btn-primary {
  display: block;
  width: 100%;
  margin-top: 16px;
  padding: 15px;
  background: #13227f;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.3px;
  transition: background 0.15s, opacity 0.15s;
}
.btn-primary:hover { background: #0e1a6a; }
.btn-primary:disabled { opacity: 0.55; cursor: default; }

.hint-cmd { text-align: center; margin-top: 10px; font-size: 12px; color: #aaa; }

/* ---- Result Screen ---- */
.result-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.btn-back {
  padding: 8px 16px;
  background: white;
  border: 1.5px solid #dde3f5;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  color: #444;
  transition: background 0.12s;
  white-space: nowrap;
}
.btn-back:hover { background: #f0f2f8; }

.result-header h1 { font-size: 20px; }

.meta-time { color: #aaa; font-size: 13px; margin-left: auto; }

/* Progress */
.progress-wrap { margin-bottom: 20px; }
.progress-bar {
  height: 5px;
  background: #e8eaf5;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 6px;
}
.progress-fill {
  height: 100%;
  background: #13227f;
  border-radius: 4px;
  transition: width 0.4s ease;
  width: 0%;
}
.progress-text { font-size: 12px; color: #888; }

/* Table */
.table-wrap {
  background: white;
  border-radius: 14px;
  overflow: auto;
  box-shadow: 0 2px 20px rgba(0,0,0,0.07);
}
table { width: 100%; border-collapse: collapse; min-width: 640px; }
thead tr { background: #13227f; }
thead th {
  color: white;
  padding: 13px 16px;
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.3px;
  white-space: nowrap;
}
tbody tr { border-bottom: 1px solid #f0f3fa; transition: background 0.1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f6f8ff; }
td { padding: 13px 16px; vertical-align: middle; }

.col-name { font-weight: 600; max-width: 220px; line-height: 1.4; }
.col-price { white-space: nowrap; font-size: 15px; }
.col-price a { font-weight: 700; text-decoration: none; }
.col-price a:hover { text-decoration: underline; }
.col-px { white-space: nowrap; font-weight: 700; font-size: 15px; color: #13227f; }
.col-suggest { font-size: 12.5px; color: #444; line-height: 1.6; min-width: 180px; }
.no-price { color: #c0c7db; }

.badge {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  vertical-align: middle;
}
.badge-win   { background: #e6f9ed; color: #1a7a3a; }
.badge-lose  { background: #fff0f1; color: #c0392b; }
.badge-close { background: #f0f0f0; color: #666; }
.badge-miss  { background: #fafafa; color: #bbb; border: 1px solid #eee; }

/* Skeleton loading */
@keyframes shimmer {
  0%   { background-position: -200% 0; }
  100% { background-position:  200% 0; }
}
.skeleton {
  height: 16px;
  width: 80px;
  border-radius: 4px;
  background: linear-gradient(90deg, #eff1fa 25%, #e5e8f5 50%, #eff1fa 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  display: inline-block;
}

.disclaimer {
  margin-top: 16px;
  font-size: 12px;
  color: #aaa;
  text-align: right;
}
</style>
</head>
<body>

<!-- ========== INPUT SCREEN ========== -->
<div id="screen-input" class="screen active">
  <div class="container">
    <div class="brand-dots">
      <div class="dot" style="background:#13227f;"></div>
      <div class="dot" style="background:#e40011;width:8px;height:8px;"></div>
    </div>
    <h1>競品比價工具</h1>
    <p class="subtitle">輸入商品清單，自動查詢 momo 與蝦皮售價</p>

    <div class="format-card">
      <div class="format-title">輸入格式</div>
      <div class="format-row">
        <code>商品名稱</code>
        <span class="format-note">僅比較競品（momo vs 蝦皮）</span>
      </div>
      <div class="format-row">
        <code>商品名稱|全電商售價</code>
        <span class="format-note">加入全電商做三方比較</span>
      </div>
      <p class="format-tip">
        💡 商品名稱建議含 品牌 + 品名 + 規格，搜尋更準確<br>
        例：<code style="font-size:11px;">CONSOFY 抽取衛生紙 120抽 24包|299</code>
      </p>
    </div>

    <textarea
      id="productInput"
      rows="10"
      placeholder="範例（每行一個商品，最多建議 10 個）：&#10;&#10;CONSOFY 抽取衛生紙 120抽 24包|299&#10;ONEDER 溫和潔淨沐浴乳 1000ml|189&#10;花仙子 好神拖拖把組|499"
    ></textarea>
    <button id="searchBtn" class="btn-primary">開始搜尋</button>
    <p class="hint-cmd">Mac 可用 ⌘ + Enter 快速開始搜尋</p>
  </div>
</div>

<!-- ========== RESULT SCREEN ========== -->
<div id="screen-result" class="screen">
  <div class="container wide">
    <div class="result-header">
      <button id="backBtn" class="btn-back">← 重新搜尋</button>
      <h1>比價結果</h1>
      <span id="resultTime" class="meta-time"></span>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">準備搜尋...</div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr id="tableHeader"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <p class="disclaimer">
      ⚠️ 資料來源：網路搜尋摘要，僅供參考。請點擊連結至各平台確認實際售價與規格。
    </p>
  </div>
</div>

<script>
// ---- Config ----
const API_KEY    = "fc-a5fa632347524872a88bdea3d27da5d0";
const SEARCH_URL = "https://api.firecrawl.dev/v1/search";

// ---- DOM ----
const screenInput  = document.getElementById("screen-input");
const screenResult = document.getElementById("screen-result");
const productInput = document.getElementById("productInput");
const searchBtn    = document.getElementById("searchBtn");
const backBtn      = document.getElementById("backBtn");
const tableHeader  = document.getElementById("tableHeader");
const tableBody    = document.getElementById("tableBody");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");
const resultTime   = document.getElementById("resultTime");

// ---- Screen switch ----
function showScreen(name) {
  [screenInput, screenResult].forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  window.scrollTo(0, 0);
}

backBtn.addEventListener("click", () => {
  showScreen("input");
  searchBtn.disabled = false;
  searchBtn.textContent = "開始搜尋";
});

// ---- Keyboard shortcut ----
productInput.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") startSearch();
});

searchBtn.addEventListener("click", startSearch);

// ---- Parse input ----
function parseProducts(text) {
  return text.split("\n")
    .map(l => l.trim())
    .filter(l => l && !l.startsWith("#"))
    .map(l => {
      const [namePart, pricePart] = l.split("|");
      const name = namePart.trim();
      const pxPrice = pricePart ? parseInt(pricePart.trim(), 10) : null;
      return { name, pxPrice: isNaN(pxPrice) ? null : pxPrice };
    })
    .filter(p => p.name);
}

// ---- Firecrawl search ----
async function searchPlatform(productName, platform) {
  const domains = { momo: "momo.com.tw", shopee: "shopee.tw" };
  // Strip Chinese brackets and special chars before searching
  const cleanName = productName.replace(/[【】《》〔〕〈〉「」『』（）()｛｝{}]/g, " ").replace(/\s+/g, " ").trim();
  const suffixes = { momo: "momo購物 售價", shopee: "蝦皮購物 售價" };
  // Quoted name = exact match; no site: so comparison sites (BigGo, 飛比) appear and they DO show prices in snippets
  const query = `"${cleanName}" ${suffixes[platform]}`;

  try {
    const resp = await fetch(SEARCH_URL, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${API_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ query, limit: 5 })
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    return extractBestPrice(data.data || []);
  } catch (err) {
    return { price: null, text: "搜尋失敗", url: "", title: String(err) };
  }
}

// ---- Extract lowest price from search snippets ----
function extractBestPrice(results) {
  const candidates = [];

  for (const item of results) {
    const text  = (item.title || "") + " " + (item.description || "");
    const url   = item.url   || "";
    const title = (item.title || "").substring(0, 60);

    for (const m of [...text.matchAll(/\$([\d,]+)/g)]) {
      const n = parseInt(m[1].replace(/,/g, ""), 10);
      if (n >= 10 && n <= 200000) candidates.push({ price: n, text: `NT$${m[1]}`, url, title });
    }
    for (const m of [...text.matchAll(/NT\$\s*([\d,]+)/g)]) {
      const n = parseInt(m[1].replace(/,/g, ""), 10);
      if (n >= 10 && n <= 200000) candidates.push({ price: n, text: `NT$${m[1]}`, url, title });
    }
    for (const m of [...text.matchAll(/(?:售價|特價|優惠價)[：:\s]*([\d,]+)\s*元/g)]) {
      const n = parseInt(m[1].replace(/,/g, ""), 10);
      if (n >= 10 && n <= 200000) candidates.push({ price: n, text: `NT$${m[1]}`, url, title });
    }
  }

  if (candidates.length === 0) {
    const first = results[0] || {};
    return {
      price: null,
      text: "未找到價格",
      url: first.url || "",
      title: (first.title || "").substring(0, 60)
    };
  }
  // Return lowest price (typically the promotional price)
  return candidates.reduce((min, c) => c.price < min.price ? c : min);
}

// ---- Render price cell ----
function priceCell(data, color) {
  if (!data || data.price === null) {
    return `<td class="col-price"><span class="no-price">—</span></td>`;
  }
  if (data.url) {
    return `<td class="col-price">` +
      `<a href="${escHtml(data.url)}" target="_blank" title="${escHtml(data.title)}" style="color:${color};">` +
      `${escHtml(data.text)} <span style="font-size:11px;opacity:0.55;">↗</span>` +
      `</a></td>`;
  }
  return `<td class="col-price" style="color:#bbb;">${escHtml(data.text)}</td>`;
}

// ---- Build suggestion ----
function buildSuggestion(pxPrice, momoData, shopeeData) {
  const mo = momoData?.price  ?? null;
  const sh = shopeeData?.price ?? null;

  if (mo === null && sh === null) {
    return `<span class="badge badge-miss">無競品資料</span>`;
  }

  const competitorPrices = [mo, sh].filter(n => n !== null);
  const compLowest  = Math.min(...competitorPrices);
  const compHighest = Math.max(...competitorPrices);

  if (pxPrice !== null) {
    if (pxPrice < compLowest) {
      return `<span class="badge badge-win">✅ 全電商最低</span> 低於最低競品 NT$${compLowest - pxPrice}`;
    }
    if (pxPrice === compLowest) {
      return `<span class="badge badge-win">✅ 並列最低</span>`;
    }
    if (pxPrice <= compHighest) {
      return `<span class="badge badge-close">🟡 居中</span> 較最低競品高 NT$${pxPrice - compLowest}`;
    }
    return `<span class="badge badge-lose">🔴 全電商偏高</span> 高於最低競品 NT$${pxPrice - compLowest}`;
  }

  // No PX price: compare momo vs shopee
  if (mo !== null && sh !== null) {
    const diff = Math.abs(mo - sh);
    if (diff <= 30) return `<span class="badge badge-close">🟡 兩平台相近</span>`;
    if (mo > sh)    return `蝦皮較低，低 momo <strong>NT$${diff}</strong>`;
    return `momo 較低，低蝦皮 <strong>NT$${diff}</strong>`;
  }
  return `<span class="badge badge-close">僅一平台有資料</span>`;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ---- Main search flow ----
async function startSearch() {
  const text = productInput.value.trim();
  if (!text) { alert("請輸入至少一個商品名稱"); return; }

  const products = parseProducts(text);
  if (products.length === 0) { alert("找不到有效的商品名稱"); return; }

  searchBtn.disabled = true;
  searchBtn.textContent = "搜尋中...";
  showScreen("result");

  const hasAnyPx = products.some(p => p.pxPrice !== null);
  const now = new Date();
  resultTime.textContent = `搜尋時間：${now.toLocaleString("zh-TW")}`;

  // Table header
  let headers = ["商品名稱"];
  if (hasAnyPx) headers.push("全電商售價");
  headers.push("momo 售價", "蝦皮 售價", "比較建議");
  tableHeader.innerHTML = headers.map(h => `<th>${h}</th>`).join("");

  // Skeleton rows
  tableBody.innerHTML = "";
  products.forEach((p, idx) => {
    const tr = document.createElement("tr");
    tr.id = "row-" + idx;
    let cells = `<td class="col-name">${escHtml(p.name)}</td>`;
    if (hasAnyPx) {
      cells += `<td class="col-px">${p.pxPrice !== null ? "NT$" + p.pxPrice.toLocaleString() : "<span class='no-price'>—</span>"}</td>`;
    }
    cells += `<td><div class="skeleton"></div></td>`;
    cells += `<td><div class="skeleton"></div></td>`;
    cells += `<td><div class="skeleton"></div></td>`;
    tr.innerHTML = cells;
    tableBody.appendChild(tr);
  });

  // Search sequentially (momo + shopee in parallel per product)
  let done = 0;
  for (let idx = 0; idx < products.length; idx++) {
    const product = products[idx];
    progressText.textContent = `搜尋中：${product.name}（${idx + 1} / ${products.length}）`;

    const [momoResult, shopeeResult] = await Promise.all([
      searchPlatform(product.name, "momo"),
      searchPlatform(product.name, "shopee")
    ]);

    done++;
    progressFill.style.width = `${(done / products.length) * 100}%`;

    // Update row
    const tr = document.getElementById("row-" + idx);
    if (!tr) continue;
    let cells = `<td class="col-name">${escHtml(product.name)}</td>`;
    if (hasAnyPx) {
      cells += `<td class="col-px">${product.pxPrice !== null ? "NT$" + product.pxPrice.toLocaleString() : "<span class='no-price'>—</span>"}</td>`;
    }
    cells += priceCell(momoResult, "#e40520");
    cells += priceCell(shopeeResult, "#ee4d2d");
    cells += `<td class="col-suggest">${buildSuggestion(product.pxPrice, momoResult, shopeeResult)}</td>`;
    tr.innerHTML = cells;
  }

  progressText.textContent = `✅ 完成，共搜尋 ${products.length} 個商品（消耗約 ${products.length * 2} Credits）`;
  searchBtn.disabled = false;
  searchBtn.textContent = "開始搜尋";
}
</script>
</body>
</html>
